<!DOCTYPE html>
<html>
<head>
    <title>Resume Analysis Result</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 400px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        h3 {
            color: #555;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .score {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .skills {
            list-style: none;
            padding: 0;
        }

        .skills li {
            background: #f3f4ff;
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            color: #333;
            font-weight: 500;
        }

        .skills li:hover {
            background: #e0e3ff;
            transform: scale(1.02);
            transition: 0.2s;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .back-btn {
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
            background: #667eea;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #5a67d8;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">📊</div>

    <h2>Resume Analysis Result</h2>

    <h3>Resume Score</h3>
    <p class="score">{{ score }}%</p>

    <h3>Skills Found</h3>
    <ul class="skills">
        {% for skill in skills %}
        <li>{{ skill }}</li>
        {% endfor %}
    </ul>

    <a href="/" class="back-btn">⬅ Upload Another Resume</a>

</div>

</body>
</html>
