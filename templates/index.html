<!DOCTYPE html>
<html>
<head>
    <title>Resume Analyzer</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        h3 {
            margin-bottom: 20px;
            color: #777;
            font-size: 14px;
            font-weight: normal;
        }

        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
        }

        input[type="file"]:hover {
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            background: #5a67d8;
            transform: scale(1.05);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="icon">📄</div>

    <h2>Upload Your Resume</h2>
    <h3>PDF format only</h3>

    <form action="/upload_resume" method="post" enctype="multipart/form-data">
        <input type="file" name="resume" required>
        <button type="submit">Upload Resume</button>
    </form>

</div>

</body>
</html>
